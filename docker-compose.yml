version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ml_practice
    # volumes:
    #   - ./src:/opt/app/
    command: uvicorn app:app --host 0.0.0.0 --port 8000
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - POSTGRES_HOST=database
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=cache
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_BUCKET=${MINIO_BUCKET}
    depends_on:
      - rabbitmq
      - database
      - cache
  
  webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ml_practice
    command: streamlit run webui/web_main.py --server.port 8501
    # volumes:
    #   - ./src:/opt/app/
    environment:
        - PYTHONPATH=.
        - BACKEND_URL=http://app:8000

  analysis_worker:
   build:
     context: .
     dockerfile: Dockerfile
   image: ml_practice
   command: python worker/analysis_worker.py
   environment:
      - PYTHONPATH=.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - POSTGRES_HOST=database
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=cache
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_BUCKET=${MINIO_BUCKET}
      - BOTHUB_TOKEN=${BOTHUB_TOKEN}
      - BOTHUB_CHAT_ID=${BOTHUB_CHAT_ID}
  #  volumes:
  #    - ./src:/opt/app/
   depends_on:
    - app
    - database
    - rabbitmq
   restart: always

  trial_worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ml_practice
    command: python worker/trial_worker.py
    deploy:
      mode: replicated
      replicas: 3

    environment:
      - PYTHONPATH=.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=${RABBITMQ_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - POSTGRES_HOST=database
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_HOST=cache
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_BUCKET=${MINIO_BUCKET}
      - BOTHUB_TOKEN=${BOTHUB_TOKEN}
      - BOTHUB_CHAT_ID=${BOTHUB_CHAT_ID}
    # volumes:
    #   - ./src:/opt/app/
    depends_on:
     - analysis_worker
    restart: always

  nginx:
    depends_on:
      - app
      - webui
    image: docker.io/nginx:latest
    ports:
      - "8080:80"
      - "10443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

  rabbitmq:
    hostname: rabbitmq
    image: docker.io/rabbitmq:4-management
    ports:
      - "15672:15672"
      - "5672:5672"
    volumes:
      - rabbitmq:/var/lib/rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    restart: on-failure

  minio:
    restart: on-failure
    image: docker.io/minio/minio:RELEASE.2025-02-07T23-21-09Z-cpuv1
    ports:
        - "9000:9000"
        - "9001:9001"
    command: server /data --console-address ':9001' --address ':9000'
    healthcheck:
      test: timeout 5s bash -c ':> /dev/tcp/127.0.0.1/9000' || exit 1
      interval: 1s
      timeout: 10s
      retries: 5
    environment:
        - MINIO_ROOT_USER=${MINIO_ROOT_USER}
        - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
        - minio_data:/data
  
  minio-create-bucket:
    image: docker.io/minio/mc:RELEASE.2025-02-08T19-14-21Z-cpuv1
    depends_on:
      minio:
        condition: service_healthy
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - ./init_bucket.sh:/tmp/init_bucket.sh
    entrypoint: ./tmp/init_bucket.sh

  database:
    image: docker.io/postgres:17.2
    volumes:
      - db:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    restart: always

  cache:
    image: docker.io/redis:latest
    volumes:
      - redis-cache:/data
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    restart: always

volumes:
  rabbitmq:
  db:
  redis-cache:
  minio_data: